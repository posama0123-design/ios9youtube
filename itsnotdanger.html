<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
  <!-- 0秒後に指定のURLへ移動する設定 -->
  <meta http-equiv="refresh" content="0; url=https://www.youtube.com/watch?v=dQw4w9WgXcQ">
  <script>
    // JavaScriptで即座に移動させる処理
    window.location.replace("https://www.youtube.com/watch?v=dQw4w9WgXcQ");
  </script>
</head>
<body>
  <p>自動で移動しない場合は<a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">こちら</a>をクリックしてください。</p>
</body>
</html>
